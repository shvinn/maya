name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Smoke test first, on a native amd64 build loaded into the runner:
      # start the container and check every domain answers. Nothing is
      # published unless this passes.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: maya:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name maya --network smoke maya:smoke
          docker run --rm --network smoke \
            -v "$PWD/.github/scripts:/smoke:ro" \
            --entrypoint python maya:smoke \
            /smoke/docker_smoke_test.py http://maya:6292

      - name: Container logs
        if: failure()
        run: docker logs maya || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Pull requests build both architectures to prove the image builds,
      # but only main and version tags publish.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
